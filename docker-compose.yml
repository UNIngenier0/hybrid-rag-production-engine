name: hybrid-rag-production-engine

# The API and its three data services. `worker` is a batch job for bulk ingestion: it only runs
# on demand (`docker compose run --rm worker <command>`). The optional observability profile
# arrives in Phase 6 (see the README roadmap).

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      REDIS_URL: redis://redis:6379/0
      QDRANT_PREFER_GRPC: "true"
      HF_TOKEN: ${HF_TOKEN:-}
      # Names the cross-encoder that enables the `hybrid+rerank` mode; empty leaves it off.
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      # Enables POST /v1/query; without a key the endpoint answers 503 and says why.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
      VERIFICATION_MODEL: ${VERIFICATION_MODEL:-}
      VERIFY_CITATIONS: ${VERIFY_CITATIONS:-true}
      QUERY_CHUNKS: ${QUERY_CHUNKS:-5}
      # Decline, without calling the model, when the best reranker score is below this.
      ABSTAIN_THRESHOLD: ${ABSTAIN_THRESHOLD:-}
    volumes:
      - hf_cache:/cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [edge, backend]
    restart: unless-stopped

  worker:
    build: .
    entrypoint: ["python", "-m", "rag_engine.workers.bulk_ingest"]
    command: ["status"]
    profiles: [ingest]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      DATASET_PATH: /data/raw/documents/test.parquet
      VECTORS_DIR: /data/vectors
      QDRANT_PREFER_GRPC: "true"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./data:/data:ro
      - hf_cache:/cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # `edge` gives it internet access to download models on first use.
    networks: [edge, backend]
    # A batch job must not starve the machine it runs on. A bigger machine can raise these in .env.
    cpus: ${WORKER_CPUS:-2}
    mem_limit: ${WORKER_MEMORY:-3g}

  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q 200'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # PostgreSQL 18+ images keep versioned data directories below this path.
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    restart: unless-stopped

networks:
  # Reachable from the host through the published API port only.
  edge: {}
  # Data services live here; the network has no route to the outside world.
  backend:
    internal: true

volumes:
  qdrant_storage:
  pg_data:
  redis_data:
  hf_cache:

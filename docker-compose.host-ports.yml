# Development override: reach Qdrant and PostgreSQL from the host, on loopback only.
#
# Needed to run the dense pass natively on the Mac, because Docker cannot use the Apple GPU:
#
#   docker compose -f docker-compose.yml -f docker-compose.host-ports.yml up -d
#
# Both services also join `edge`, since a service on the internal `backend` network alone
# cannot publish ports. Do not use this file in production.

services:
  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    networks: [edge, backend]

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    networks: [edge, backend]

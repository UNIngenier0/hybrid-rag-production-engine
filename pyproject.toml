[project]
name = "hybrid-rag-production-engine"
version = "0.1.0"
description = "Production-grade RAG engine: hybrid search, reranking and verified citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "fastembed>=0.9.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "prometheus-client>=0.21",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.5",
    "qdrant-client>=1.19.1",
    "redis>=5.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
embeddings = [
    "sentence-transformers>=6.1.0",
    # Declared directly so the Linux CPU index below applies to it.
    "torch>=2.4",
]
# Drives the offline GPU embedding job on Kaggle (scripts/kaggle).
kaggle = [
    "kaggle>=2.2.4",
]

# On Linux, torch comes from PyTorch's CPU index: the default wheels drag in gigabytes of CUDA
# libraries that a CPU worker image never uses. macOS keeps the PyPI wheel (it includes MPS).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true  # asyncpg ships no type information

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true  # grpcio ships no type information; qdrant-client brings it in

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true  # pyarrow ships no type information

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true  # optional `embeddings` group, not installed in every environment

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers -m 'not integration and not models'"
markers = [
    "integration: needs the running docker compose stack (run with -m integration)",
    "models: downloads model files from Hugging Face (run with -m models)",
]
